<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="./TemplateBasic.xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="jakarta.tags.core"
                xmlns:f="jakarta.faces.core">

  <ui:define name="content">
    <div style="padding: 2%">
      <p:panel
        style="align-content: center; background-color: whitesmoke; border-color: black; width: 80%; height: 200px;" >

        <h2>Hello
          #{resetPasswordBean.participant.namesGiven}
          #{resetPasswordBean.participant.namesFamily}</h2>
        <br />
        <h2>#{resetPasswordBean.getResetPasswordMsg()}</h2>
        <br />
        e-mail: #{resetPasswordBean.participant.email}

      </p:panel>
    </div>
  </ui:define>
</ui:composition>
