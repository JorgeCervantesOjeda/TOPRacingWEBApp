<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./TemplateEdit.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="editTitle">
    <h2>Edit Variant</h2>
    <p:commandButton styleClass="mybutton"   type="submit"
                     actionListener="#{editVariantBean.clickEndEdit()}"
                     onclick="PF('dlgWait').show();"
                     ajax="false"
                     icon="fa fa-fw fa-arrow-left"
                     style="float: left"
                     />
  </ui:define>
  <ui:define name="editForm">
    <table>
      <tr> <td align="right" class="field_label">Identity:</td>
        <td align="left"> <h:outputText class="field_output" value="#{editVariantBean.variant.id}"/></td></tr>

      <tr> <td align="right" class="field_label">Name:</td>
        <td align="left">
          <p:inputText value="#{editVariantBean.variant.name}"
                       disabled="#{editVariantBean.disableEditNameField}"
                       required="true"/>
        </td>
      </tr>

      <tr> <td align="right" class="field_label">Venue:</td>
        <td align="left">
          <h:outputText class="field_output"
                        value="#{editVariantBean.getVenueName()}"
                        style="white-space: pre-line; text-align: left;"
                        />
          <br/>
          <p:commandButton styleClass="mybutton"  actionListener="#{editVariantBean.clickViewVenues()}"
                           onclick="PF('dlgWait').show();"
                           ajax="false"
                           value="View Venues"
                           /></td></tr>

      <tr> <td align="right" class="field_label">Min Width:</td>
        <td align="left">
          <p:inputText    value="#{editVariantBean.variant.minWidth}"
                          disabled="#{editVariantBean.disableEditMinwidthField}"
                          required="true"
                          style="width: 60px"
                          >
          </p:inputText>
          <h:outputText style="font-weight: bold; color: ##{editRegattaBean.regatta.colorFg}" value="#{editVariantBean.getShortDistanceUnits()}"></h:outputText>
        </td></tr>

      <tr> <td align="right" class="field_label">Length:</td>
        <td align="left">
          <p:inputText    value="#{editVariantBean.variant.length}"
                          disabled="#{editVariantBean.disableEditLengthField}"
                          required="true"
                          style="width: 60px"
                          >
          </p:inputText>
          <h:outputText style="font-weight: bold; color: ##{editRegattaBean.regatta.colorFg}" value="#{editVariantBean.getDistanceUnits()}"></h:outputText>
        </td></tr>

    </table>
    <br/>

    <p:commandButton styleClass="mybutton"   type="submit"
                     actionListener="#{editVariantBean.clickSave()}"
                     onclick="PF('dlgWait').show();"
                     ajax="true"
                     disabled="#{editVariantBean.disableSaveButton}"
                     value="Save data"
                     />
    <br/><br/>
  </ui:define>

</ui:composition>
