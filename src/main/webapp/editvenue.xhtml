<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./TemplateEdit.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="editTitle">
    <h2>Edit Venue</h2>
    <p:commandButton styleClass="mybutton"   type="submit"
                     actionListener="#{editVenueBean.clickEndEdit()}"
                     onclick="PF('dlgWait').show();"
                     ajax="true"
                     icon="fa fa-fw fa-arrow-left"
                     style="float: left"
                     />
  </ui:define>
  <ui:define name="editForm">
    <table>
      <tr> <td align="right" class="field_label">Identity:</td>
        <td align="left"> <h:outputText class="field_output"
                                        value="#{editVenueBean.venue.id}"/></td></tr>

      <tr> <td align="right" class="field_label">Name:</td>
        <td align="left">
          <p:inputText value="#{editVenueBean.venue.name}"
                       disabled="#{editVenueBean.disableEditNameField}"
                       required="true"
                       style="width: 300px"
                       /></td></tr>

      <tr> <td align="right" class="field_label">Owner:</td>
        <td align="left">
          <p:inputText value="#{editVenueBean.venue.participant.id}"
                       disabled="#{editVenueBean.disableEditOwnerField}"
                       required="true"
                       style="width: 60px"
                       /></td></tr>

      <tr> <td align="right" class="field_label">Meridian:</td>
        <td align="left">
          <p:inputText    value="#{editVenueBean.venue.meridian}"
                          disabled="#{editVenueBean.disableEditMeridianField}"
                          required="true"
                          style="width: 120px"
                          >
          </p:inputText></td></tr>

      <tr> <td align="right" class="field_label">Parallel:</td>
        <td align="left">
          <p:inputText    value="#{editVenueBean.venue.parallel}"
                          disabled="#{editVenueBean.disableEditParallelField}"
                          required="true"
                          style="width: 120px"
                          >
          </p:inputText></td></tr>

      <tr> <td align="right" class="field_label">Province Region:</td>
        <td align="left">
          <h:outputText class="field_output"
                        value="#{editVenueBean.getProvinceregionName()}"
                        style="white-space: pre-line; text-align: left;"
                        />
          <br/>
          <p:commandButton
            styleClass="mybutton"
            actionListener="#{editVenueBean.clickViewProvinceregions()}"
            onclick="PF('dlgWait').show();"
            ajax="false"
            validateClient="false"
            value="View Province Regions"
            />
        </td>
      </tr>

    </table>
    <br/>

    <p:commandButton styleClass="mybutton"
                     type="submit"
                     actionListener="#{editVenueBean.clickSave()}"
                     onclick="PF('dlgWait').show();"
                     disabled="#{editVenueBean.disableSaveButton}"
                     validateClient="true"
                     ajax="false"
                     value="Save data" />
    <br /><br />
  </ui:define>

</ui:composition>
