<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="./TemplateEdit.xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="editTitle">
    <h2>Edit Province Region</h2>
    <p:commandButton styleClass="mybutton"   type="submit"
                     actionListener="#{editProvinceregionBean.clickEndEdit()}"
                     onclick="PF('dlgWait').show();"
                     ajax="true"
                     icon="fa fa-fw fa-arrow-left"
                     style="float: left"
                     />
  </ui:define>
  <ui:define name="editForm">
    <table>
      <tr> <td align="right" class="field_label">Identity:</td>
        <td align="left"> <h:outputText class="field_output"
                                        value="#{editProvinceregionBean.provinceregion.id}"/></td></tr>

      <tr> <td align="right" class="field_label">Name:</td>
        <td align="left">
          <p:inputText value="#{editProvinceregionBean.provinceregion.name}"
                       disabled="#{editProvinceregionBean.disableEditNameField}"
                       required="true"/></td></tr>




      <tr> <td align="right" class="field_label">Province:</td>
        <td align="left">
          <h:outputText class="field_output"
                        value="#{editProvinceregionBean.getProvinceName()}"
                        style="white-space: pre-line; text-align: left;"
                        />
          <br/>
          <p:commandButton styleClass="mybutton"  actionListener="#{editProvinceregionBean.clickViewProvinces()}"
                           onclick="PF('dlgWait').show();"
                           value="View Provinces"
                           /></td></tr>

    </table>
    <br/>

    <p:commandButton styleClass="mybutton"   type="submit"
                     actionListener="#{editProvinceregionBean.clickSave()}"
                     onclick="PF('dlgWait').show();"
                     disabled="#{editProvinceregionBean.disableSaveButton}"
                     ajax="true"
                     value="Save data"
                     />
    <br/><br/>
  </ui:define>

</ui:composition>
