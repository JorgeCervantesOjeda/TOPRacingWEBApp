<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./TemplateBasic.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="content">
    <table>
      <tr><td align="right" class="field_label">User number:</td>
        <td align="left">
          <h:outputText class="field_output"
                        value="#{editParticipantBean.participant.id}" /></td></tr>

      <tr><td align="right" class="field_label">Password:</td>
        <td align="left">
          <p:password id="passwordInput"
                      value="#{editParticipantBean.participant.password}"
                      size="16"
                      feedback="true"
                      required="false" >
            <f:validateLength minimum="0" />
          </p:password>
          <p:message for="passwordInput" />
        </td></tr>

      <tr><td align="right" class="field_label">Given names:</td>
        <td align="left">
          <p:inputText id="givenNamesInput"
                       value="#{editParticipantBean.participant.namesGiven}"
                       size="30"
                       placeholder="First and middle names"
                       required="true" >
            <f:validateLength minimum="2" />
            <p:clientValidator />
          </p:inputText>
          <p:message for="givenNamesInput" />
        </td></tr>

      <tr><td align="right" class="field_label">Family names:</td>
        <td align="left">
          <p:inputText id="familyNamesInput"
                       value="#{editParticipantBean.participant.namesFamily}"
                       size="30"
                       placeholder="Last name(s)"
                       required="true" >
            <f:validateLength minimum="2" />
            <p:clientValidator />
          </p:inputText>
          <p:message for="familyNamesInput" />
        </td></tr>

      <tr><td align="right" class="field_label">e-mail address:</td>
        <td align="left">
          <p:inputText id="emailInput"
                       value="#{editParticipantBean.participant.email}"
                       size="30"
                       placeholder="nombre@sitio.com"
                       required="true" >
            <f:validateRegex
              pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$"/>
            <p:clientValidator event="keyup" />
          </p:inputText>
          <p:message for="emailInput" />
        </td></tr>

      <tr><td align="right" class="field_label">Phone number:</td>
        <td align="left">
          <p:inputText id="phoneInput"
                       value="#{editParticipantBean.participant.phone}"
                       size="30"
                       placeholder="5555555555"
                       required="true" >
            <f:validateRegex pattern="^[0-9]{10}"/>
            <p:clientValidator event="keyup" />
          </p:inputText>
          <p:message for="phoneInput" />
        </td></tr>

      <tr> <td align="right" class="field_label">Main Venue:</td>
        <td align="left">
          <h:outputText class="field_output"
                        value="#{editParticipantBean.participant != null &amp;&amp; editParticipantBean.participant.venue != null ? editParticipantBean.participant.venue.name : 'Venue not set yet.'}"
                        style="white-space: pre-line; text-align: left;"
                        />
          <br/>
          <p:commandButton id="viewVenuesButton"
                           styleClass="mybutton"
                           actionListener="#{editParticipantBean.clickViewVenues()}"
                           onclick="PF('dlgWait').show();"
                           ajax="false"
                           value="View Venues"
                           /></td></tr>

      <tr><td align="right" class="field_label">Current rules:</td>
        <td align="left">
          <h:outputText class="field_output"
                        value="Version #{editParticipantBean.currentTermsVersion}, effective #{editParticipantBean.currentTermsEffectiveDate}" />
          <br/>
          <p:commandButton id="viewCurrentRulesButton"
                           type="button"
                           styleClass="mybutton"
                           onclick="PF('currentRulesDialog').show();"
                           value="View current rules"
                           />
          <br/>
          <p:selectBooleanCheckbox id="acceptCurrentTerms"
                                   value="#{editParticipantBean.acceptCurrentTerms}" />
          <p:outputLabel for="acceptCurrentTerms"
                         value="I accept the current TOP Racing rules version shown above." />
          <br/>
          <h:outputText class="field_output"
                        rendered="#{!editParticipantBean.currentTermsAccepted}"
                        value="You must accept the current rules before using protected operations." />
        </td></tr>

    </table>
    <br/>
    <p:commandButton id="saveParticipantButton"
                     styleClass="mybutton"
                     actionListener="#{editParticipantBean.clickSave()}"
                     onclick="PF('dlgWait').show()"
                     validateClient="true"
                     ajax="false"
                     value="Save data"
                     />
    <br/>
    <p:dialog id="currentRulesDialog"
              widgetVar="currentRulesDialog"
              header="Current TOP Racing rules"
              modal="true"
              resizable="false"
              width="640">
      <h:outputText value="#{editParticipantBean.currentTermsText}"
                    style="white-space: pre-line;" />
    </p:dialog>
  </ui:define>

</ui:composition>
