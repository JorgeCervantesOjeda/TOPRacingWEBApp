<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./TemplateBasic.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="content">
    <h2>Variants: #{listVariantsBean.getNumVariants()}</h2>

    <p:dataTable id="variants"
                 var="item"
                 value="#{listVariantsBean.variants}"
                 widgetVar="variantsTable"
                 emptyMessage="No Variants match that criteria"
                 filteredValue="#{listVariantsBean.filteredVariants}"
                 style="font-stretch: condensed; width: 100%; height: 90%;"
                 scrollable="true"
                 scrollRows="10"
                 scrollHeight="90%"
                 scrollWidth="80%"
                 liveScroll="false"
                 resizableColumns="true"
                 selection="#{listVariantsBean.selectedVariant}"
                 selectionMode="single"
                 rowKey="#{item.id}"
                 rowIndexVar="rowIndex"
                 >
      <p:ajax event="rowSelect"
              listener="#{listVariantsBean.rowSelectVariant}"
              update="contentForm"
              process="variants"
              onstart="PF('dlgWait').show();" />

      <f:facet name="header">
        <p:outputPanel>
          <h:outputText value="Search all columns:" />
          <p:inputText id="globalFilter" onkeyup="PF('variantsTable').filter()"
                       style="width:150px" placeholder="Write here"/>

          <p:commandButton styleClass="mybutton"
                           actionListener="#{listVariantsBean.clickNewVariant()}"
                           value="Create new Variant"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: right" >
            <p:confirm header="Are you sure?"
                       message="Create new Variant" />
          </p:commandButton>
          <p:commandButton styleClass="mybutton"
                           actionListener="#{listVariantsBean.clickReturn()}"
                           icon="fa fa-fw fa-arrow-left"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: left" ></p:commandButton>
        </p:outputPanel>
      </f:facet>

      <p:column headerText="&#160;" footerText="&#160;"
                style="width: 80px"
                >
        <p:commandButton styleClass="mybutton"
                         actionListener="#{listVariantsBean.clickSelectVariant( item )}"
                         value="Select"
                         onclick="PF('dlgWait').show();"
                         ajax="true"
                         disabled="#{listVariantsBean.disableSelectVariant( item )}" /> </p:column>

      <p:column headerText="Id" footerText="Id"
                filterBy="#{item.id}"
                sortBy="#{item.id}"
                filterMatchMode="exact"
                style="white-space: pre-line; text-align: center; width: 40px">
        <f:facet name="filter">  <p:inputText style="width: 35px" size="1"
                                              onkeyup="PF('variantsTable').filter()" /> </f:facet>
        <h:outputText value="#{item.id}"/>  </p:column>

      <p:column headerText="Name" footerText="Name"
                filterBy="#{item.name}"
                sortBy="#{item.name}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 90px">
        <f:facet name="filter">  <p:inputText style="width: 70px" size="1"
                                              onkeyup="PF('variantsTable').filter()" /> </f:facet>
        <h:outputText value="#{item.name}"/>  </p:column>

      <p:column headerText="Venue" footerText="Venue"
                filterBy="#{listVariantsBean.getVenueName(item)}"
                sortBy="#{listVariantsBean.getVenueName(item)}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 200px">
        <f:facet name="filter">  <p:inputText style="width: 70px" size="1"
                                              onkeyup="PF('variantsTable').filter()" /> </f:facet>
        <h:outputText value="#{listVariantsBean.getVenueName(item)}"/>  </p:column>

      <p:column headerText="Min Width"
                footerText="Min Width"
                sortBy="#{item.minWidth}"
                style="white-space: pre-line; text-align: right; width: 110px">
        <h:outputText value="#{item.minWidth} #{listVariantsBean.getShortDistanceUnits(item.metric)}"/></p:column>

      <p:column headerText="Length"
                footerText="Length"
                sortBy="#{item.length}"
                style="white-space: pre-line; text-align: right; width: 80px">
        <h:outputText value="#{item.length} #{listVariantsBean.getDistanceUnits(item.metric)}"/></p:column>

      <p:column headerText="Creator" footerText="Creator"
                filterBy="#{listVariantsBean.getCreatorName( item.idCreator )}"
                sortBy="#{listVariantsBean.getCreatorName( item.idCreator )}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left;">
        <f:facet name="filter">  <p:inputText style="width: 70px" size="1"
                                              onkeyup="PF('variantsTable').filter()" /> </f:facet>
        <h:outputText value="#{listVariantsBean.getCreatorName( item.idCreator )}"/>  </p:column>

    </p:dataTable>
    <h1><br /></h1>
  </ui:define>

</ui:composition>
