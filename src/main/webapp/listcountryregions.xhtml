<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="./TemplateBasic.xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="content">
    <h2>Country Regions: #{listCountryregionsBean.getNumCountryregions()}</h2>

    <p:dataTable id="countryregions"
                 var="item"
                 value="#{listCountryregionsBean.countryregions}"
                 widgetVar="countryregionsTable"
                 emptyMessage="No Country Regions match that criteria"
                 filteredValue="#{listCountryregionsBean.filteredCountryregion}"
                 style="font-stretch: condensed; width: 100%; height: 90%; padding: 0px"
                 scrollable="true"
                 scrollRows="5"
                 scrollHeight="90%"
                 scrollWidth="90%"
                 liveScroll="false"
                 resizableColumns="true"
                 selection="#{listCountryregionsBean.selectedCountryregion}"
                 selectionMode="single"
                 rowKey="#{item.id}"
                 rowIndexVar="rowIndex"
                 >
      <p:ajax event="rowSelect"
              listener="#{listCountryregionsBean.rowSelectCountryregion}"
              update="contentForm"
              process="countryregions"
              onstart="PF('dlgWait').show();" />


      <f:facet name="header">
        <p:outputPanel>
          <h:outputText value="Search all columns" />
          <p:inputText id="globalFilter"
                       onkeyup="PF('countryregionsTable').filter()"
                       style="width:150px"
                       placeholder="Escribe aquí"/>

          <p:commandButton styleClass="mybutton"  actionListener="#{listCountryregionsBean.clickNewCountryregion()}"
                           value="Create new Country Region"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: right">
            <p:confirm header="Are you sure?"
                       message="Create new Country Region" />
          </p:commandButton>

          <p:commandButton styleClass="mybutton"  actionListener="#{listCountryregionsBean.clickReturn()}"
                           icon="fa fa-fw fa-arrow-left"
                           onclick="PF('dlgWait').show();"
                           ajax="false"
                           style="float: left"/>

        </p:outputPanel>
      </f:facet>

      <p:column headerText="&#160;" footerText="&#160;"
                style="width: 40px"
                >
        <p:commandButton styleClass="mybutton"
                         actionListener="#{listCountryregionsBean.clickSelectCountryregion( item )}"
                         value="Select"
                         onclick="PF('dlgWait').show();"
                         ajax="false"/> </p:column>

      <p:column headerText="Id" footerText="Id"
                filterBy="#{item.id}"
                sortBy="#{item.id}"
                filterMatchMode="exact"
                style="text-align: center; width: 30px" >
        <f:facet name="filter">
          <p:inputText style="width: 35px"
                       size="1"
                       onkeyup="PF('countryregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.id}"/>  </p:column>

      <p:column headerText="Name" footerText="Name"
                filterBy="#{item.name}"
                sortBy="#{item.name}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('countryregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.name}"/>  </p:column>


      <p:column headerText="Country" footerText="Country"
                filterBy="#{listCountryregionsBean.getCountryName(item)}"
                sortBy="#{listCountryregionsBean.getCountryName(item)}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('countryregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{listCountryregionsBean.getCountryName(item)}"/>
      </p:column>

      <p:column headerText="Creator" footerText="Creator"
                filterBy="#{listCountryregionsBean.getCreatorName( item.idCreator )}"
                sortBy="#{listCountryregionsBean.getCreatorName( item.idCreator )}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('countryregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{listCountryregionsBean.getCreatorName( item.idCreator )}"/>
      </p:column>

    </p:dataTable>
    <h1><br /></h1>
  </ui:define>

</ui:composition>
