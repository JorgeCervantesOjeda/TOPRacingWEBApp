<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./TemplateBasic.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="content">
    <h2>Countries: #{listCountriesBean.getNumCountries()}</h2>

    <p:dataTable id="countries"
                 var="item"
                 value="#{listCountriesBean.countries}"
                 widgetVar="countriesTable"
                 emptyMessage="No Countries match that criteria"
                 filteredValue="#{listCountriesBean.filteredCountry}"
                 style="font-stretch: condensed; width: 100%; height: 90%; padding: 0px"
                 scrollable="true"
                 scrollRows="5"
                 scrollHeight="90%"
                 scrollWidth="90%"
                 liveScroll="false"
                 resizableColumns="true"
                 selection="#{listCountriesBean.selectedCountry}"
                 selectionMode="single"
                 rowKey="#{item.id}"
                 rowIndexVar="rowIndex"
                 >
      <p:ajax event="rowSelect"
              listener="#{listCountriesBean.rowSelectCountry}"
              update="contentForm"
              process="countries"
              onstart="PF('dlgWait').show();" />


      <f:facet name="header">
        <p:outputPanel>
          <h:outputText value="Search all columns" />
          <p:inputText id="globalFilter"
                       onkeyup="PF('countriesTable').filter()"
                       style="width:150px"
                       placeholder="Escribe aquí"/>

          <p:commandButton styleClass="mybutton"  actionListener="#{listCountriesBean.clickNewCountry()}"
                           value="Create new Country"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: right">
            <p:confirm header="Are you sure?"
                       message="Create new Country" />
          </p:commandButton>

          <p:commandButton styleClass="mybutton"  actionListener="#{listCountriesBean.clickReturn()}"
                           icon="fa fa-fw fa-arrow-left"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: left"/>

        </p:outputPanel>
      </f:facet>


      <p:column headerText="&#160;" footerText="&#160;"
                style="width: 110px"
                >
        <p:commandButton styleClass="mybutton"
                         actionListener="#{listCountriesBean.clickSelectCountry( item )}"
                         value="Select"
                         onclick="PF('dlgWait').show();"
                         ajax="true"/> </p:column>

      <p:column headerText="Id" footerText="Id"
                filterBy="#{item.id}"
                sortBy="#{item.id}"
                filterMatchMode="exact"
                style="text-align: center; width: 30px" >
        <f:facet name="filter">
          <p:inputText style="width: 35px"
                       size="1"
                       onkeyup="PF('countriesTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.id}"/>  </p:column>

      <p:column headerText="Name" footerText="Name"
                filterBy="#{item.name}"
                sortBy="#{item.name}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('countriesTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.name}"/>  </p:column>


      <p:column headerText="Planet Region" footerText="Planet Region"
                filterBy="#{item.planetregion.name}"
                sortBy="#{item.planetregion.name}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 120px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('countriesTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.planetregion.name}"/>
      </p:column>

      <p:column headerText="Creator" footerText="Creator"
                filterBy="#{listCountriesBean.getCreatorName( item.idCreator )}"
                sortBy="#{listCountriesBean.getCreatorName( item.idCreator )}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('countriesTable').filter()" />
        </f:facet>
        <h:outputText value="#{listCountriesBean.getCreatorName( item.idCreator )}"/>
      </p:column>

    </p:dataTable>
    <h1><br /></h1>
  </ui:define>

</ui:composition>
