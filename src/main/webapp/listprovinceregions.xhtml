<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="./TemplateBasic.xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="content">
    <h2>Province Regions: #{listProvinceregionsBean.getNumProvinceregions()}</h2>

    <p:dataTable id="provinceregions"
                 var="item"
                 value="#{listProvinceregionsBean.provinceregions}"
                 widgetVar="provinceregionsTable"
                 emptyMessage="No Province Regions match that criteria"
                 filteredValue="#{listProvinceregionsBean.filteredProvinceregion}"
                 style="font-stretch: condensed; width: 100%; height: 90%; padding: 0px"
                 scrollable="true"
                 scrollRows="5"
                 scrollHeight="90%"
                 scrollWidth="90%"
                 liveScroll="false"
                 resizableColumns="true"
                 selection="#{listProvinceregionsBean.selectedProvinceregion}"
                 selectionMode="single"
                 rowKey="#{item.id}"
                 rowIndexVar="rowIndex"
                 >
      <p:ajax event="rowSelect"
              listener="#{listProvinceregionsBean.rowSelectProvinceregion}"
              update="contentForm"
              process="provinceregions"
              onstart="PF('dlgWait').show();" />

      <f:facet name="header">
        <p:outputPanel>
          <h:outputText value="Search all columns:" />
          <p:inputText id="globalFilter"
                       onkeyup="PF('provinceregionsTable').filter()"
                       style="width:150px"
                       placeholder="Write here"/>

          <p:commandButton styleClass="mybutton"  actionListener="#{listProvinceregionsBean.clickNewProvinceregion()}"
                           value="Create new Province Region"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: right">
            <p:confirm header="Are you sure?"
                       message="Create new Provice Region" />
          </p:commandButton>

          <p:commandButton styleClass="mybutton"  actionListener="#{listProvinceregionsBean.clickReturn()}"
                           icon="fa fa-fw fa-arrow-left"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: left" />

        </p:outputPanel>
      </f:facet>

      <p:column headerText="&#160;" footerText="&#160;"
                style="width: 70px"
                >
        <p:commandButton styleClass="mybutton"
                         actionListener="#{listProvinceregionsBean.clickSelectProvinceregion( item )}"
                         value="Select"
                         onclick="PF('dlgWait').show();"
                         ajax="true"/> </p:column>

      <p:column headerText="Id" footerText="Id"
                filterBy="#{item.id}"
                sortBy="#{item.id}"
                filterMatchMode="exact"
                style="text-align: center; width: 30px" >
        <f:facet name="filter">
          <p:inputText style="width: 35px"
                       size="1"
                       onkeyup="PF('provinceregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.id}"/>  </p:column>

      <p:column headerText="Name" footerText="Name"
                filterBy="#{item.name}"
                sortBy="#{item.name}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('provinceregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.name}"/>  </p:column>

      <p:column headerText="Province" footerText="Province"
                filterBy="#{listProvinceregionsBean.getProvinceName(item)}"
                sortBy="#{listProvinceregionsBean.getProvinceName(item)}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 200px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('provinceregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{listProvinceregionsBean.getProvinceName(item)}"/>
      </p:column>

      <p:column headerText="Creator" footerText="Creator"
                filterBy="#{listProvinceregionsBean.getCreatorName( item.idCreator )}"
                sortBy="#{listProvinceregionsBean.getCreatorName( item.idCreator )}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('provinceregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{listProvinceregionsBean.getCreatorName( item.idCreator )}"/>
      </p:column>

    </p:dataTable>
    <h1><br /></h1>
  </ui:define>

</ui:composition>
