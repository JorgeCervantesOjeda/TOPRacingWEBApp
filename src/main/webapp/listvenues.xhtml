<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="./TemplateBasic.xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="content">
    <h2>Venues: #{listVenuesBean.getNumVenues()}</h2>

    <p:dataTable id="venues"
                 var="item"
                 value="#{listVenuesBean.venues}"
                 widgetVar="venuesTable"
                 emptyMessage="No Venues match that criteria"
                 filteredValue="#{listVenuesBean.filteredVenue}"
                 style="font-stretch: condensed; width: 100%; height: 90%;"
                 scrollable="true"
                 scrollRows="5"
                 scrollHeight="90%"
                 scrollWidth="90%"
                 liveScroll="false"
                 resizableColumns="true"
                 selection="#{listVenuesBean.selectedVenue}"
                 selectionMode="single"
                 rowKey="#{item.id}"
                 rowIndexVar="rowIndex"
                 >
      <p:ajax event="rowSelect"
              listener="#{listVenuesBean.rowSelectVenue}"
              update="contentForm"
              process="venues"
              onstart="PF('dlgWait').show();" />

      <f:facet name="header">
        <p:outputPanel>
          <h:outputText value="Search all columns:" />
          <p:inputText id="globalFilter" onkeyup="PF('venuesTable').filter()"
                       style="width:150px" placeholder="Write here"/>

          <p:commandButton styleClass="mybutton"  actionListener="#{listVenuesBean.clickNewVenue()}"
                           value="Create new Venue"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: right" >
            <p:confirm header="Are you sure?"
                       message="Create new Venue" />
          </p:commandButton>
          <p:commandButton styleClass="mybutton"  actionListener="#{listVenuesBean.clickReturn()}"
                           icon="fa fa-fw fa-arrow-left"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: left" ></p:commandButton>
        </p:outputPanel>
      </f:facet>

      <p:column headerText="&#160;" footerText="&#160;"
                style="width: 80px"
                >
        <p:commandButton styleClass="mybutton"  actionListener="#{listVenuesBean.clickSelectVenue( item )}"
                         value="Select"
                         onclick="PF('dlgWait').show();"
                         ajax="true"/> </p:column>

      <p:column headerText="&#160;" footerText="&#160;"
                style="width: 120px"
                >
        <p:commandButton styleClass="mybutton"  actionListener="#{listVenuesBean.clickViewVenueInMap( item )}"
                         value="View in Map"
                         onclick="PF('dlgWait').show();"
                         ajax="true"
                         style="white-space: pre-line; float: top; width: 120px" ></p:commandButton>
      </p:column>


      <p:column headerText="Id" footerText="Id"
                filterBy="#{item.id}"
                sortBy="#{item.id}"
                filterMatchMode="exact"
                style="white-space: pre-line; text-align: center; width: 30px">
        <f:facet name="filter">
          <p:inputText style="width: 35px"
                       size="1"
                       onkeyup="PF('venuesTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.id}"/>
      </p:column>

      <p:column headerText="Name" footerText="Name"
                filterBy="#{item.name}"
                sortBy="#{item.name}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 130px">
        <f:facet name="filter">
          <p:inputText style="width: 120px"
                       size="1"
                       onkeyup="PF('venuesTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.name}"/>  </p:column>

      <p:column headerText="Province Region" footerText="Province Region"
                filterBy="#{listVenuesBean.getProvinceregionName(item)}"
                sortBy="#{listVenuesBean.getProvinceregionName(item)}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 200px">
        <f:facet name="filter">  <p:inputText style="width: 80px" size="1"
                                              onkeyup="PF('venuesTable').filter()" /> </f:facet>
        <h:outputText value="#{listVenuesBean.getProvinceregionName(item)}"/>  </p:column>

      <p:column headerText="Owner" footerText="Owner"
                filterBy="#{listVenuesBean.getOwnerName( item.participant )}"
                sortBy="#{listVenuesBean.getOwnerName( item.participant )}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 130px">
        <f:facet name="filter">  <p:inputText style="width: 120px" size="1"
                                              onkeyup="PF('venuesTable').filter()" /> </f:facet>
        <h:outputText value="#{listVenuesBean.getOwnerName( item.participant )}"/>  </p:column>

      <p:column headerText="Meridian" footerText="Meridian"
                sortBy="#{item.meridian}"
                style="white-space: pre-line; text-align: right; width: 160px">
        <h:outputText value="#{item.meridian}"/></p:column>

      <p:column headerText="Parallel" footerText="Parallel"
                sortBy="#{item.parallel}"
                style="white-space: pre-line; text-align: right; width: 160px">
        <h:outputText value="#{item.parallel}"/></p:column>

      <p:column headerText="Registered by" footerText="Registered by"
                filterBy="#{listVenuesBean.getCreatorName( item.idCreator )}"
                sortBy="#{listVenuesBean.getCreatorName( item.idCreator )}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px">
        <f:facet name="filter">  <p:inputText style="width: 120px" size="1"
                                              onkeyup="PF('venuesTable').filter()" /> </f:facet>
        <h:outputText value="#{listVenuesBean.getCreatorName( item.idCreator )}"/>  </p:column>

    </p:dataTable>
    <h1><br /></h1>
  </ui:define>

</ui:composition>
