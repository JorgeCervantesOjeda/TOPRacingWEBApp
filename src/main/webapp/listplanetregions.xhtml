<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="./TemplateBasic.xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

  <ui:define name="content">
    <h2>Planet Regions: #{listPlanetregionsBean.getNumPlanetregions()}</h2>

    <p:dataTable id="planetregions"
                 var="item"
                 value="#{listPlanetregionsBean.planetregions}"
                 widgetVar="planetregionsTable"
                 emptyMessage="No Planet Regions match that criteria"
                 filteredValue="#{listPlanetregionsBean.filteredPlanetregion}"
                 style="font-stretch: condensed; width: 100%; heigth: 90%; padding: 0px"
                 scrollable="true"
                 scrollRows="5"
                 scrollHeight="90%"
                 scrollWidth="90%"
                 liveScroll="false"
                 resizableColumns="true"
                 selection="#{listPlanetregionsBean.selectedPlanetregion}"
                 selectionMode="single"
                 rowKey="#{item.id}"
                 rowIndexVar="rowIndex"
                 >
      <p:ajax event="rowSelect"
              listener="#{listPlanetregionsBean.rowSelectPlanetregion}"
              update="contentForm"
              process="planetregions"
              onstart="PF('dlgWait').show();" />


      <f:facet name="header">
        <p:outputPanel>
          <h:outputText value="Search all columns" />
          <p:inputText id="globalFilter"
                       onkeyup="PF('planetregionsTable').filter()"
                       style="width:150px"
                       placeholder="Write here"/>

          <p:commandButton styleClass="mybutton"  actionListener="#{listPlanetregionsBean.clickNewPlanetregion()}"
                           value="Create new Planet Region"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: right">
            <p:confirm header="Are you sure?"
                       message="Create new Planet Region" />
          </p:commandButton>

          <p:commandButton styleClass="mybutton"  actionListener="#{listPlanetregionsBean.clickReturn()}"
                           icon="fa fa-fw fa-arrow-left"
                           onclick="PF('dlgWait').show();"
                           ajax="true"
                           style="float: left"/>

        </p:outputPanel>
      </f:facet>


      <p:column headerText="&#160;" footerText="&#160;"
                style="width: 110px"
                >
        <p:commandButton styleClass="mybutton"
                         actionListener="#{listPlanetregionsBean.clickSelectPlanetregion( item )}"
                         value="Select"
                         onclick="PF('dlgWait').show();"
                         ajax="true"/> </p:column>

      <p:column headerText="Id" footerText="Id"
                filterBy="#{item.id}"
                sortBy="#{item.id}"
                filterMatchMode="exact"
                style="text-align: center; width: 30px" >
        <f:facet name="filter">
          <p:inputText style="width: 35px"
                       size="1"
                       onkeyup="PF('planetregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.id}"/>  </p:column>

      <p:column headerText="Name" footerText="Name"
                filterBy="#{item.name}"
                sortBy="#{item.name}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('planetregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{item.name}"/>  </p:column>


      <p:column headerText="Creator" footerText="Creator"
                filterBy="#{listPlanetregionsBean.getCreatorName( item.idCreator )}"
                sortBy="#{listPlanetregionsBean.getCreatorName( item.idCreator )}"
                filterMatchMode="contains"
                style="white-space: pre-line; text-align: left; width: 100px" >
        <f:facet name="filter">
          <p:inputText style="width: 90px"
                       size="1"
                       onkeyup="PF('planetregionsTable').filter()" />
        </f:facet>
        <h:outputText value="#{listPlanetregionsBean.getCreatorName( item.idCreator )}"/>
      </p:column>

    </p:dataTable>
    <h1><br /></h1>
  </ui:define>

</ui:composition>
