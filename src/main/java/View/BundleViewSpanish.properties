CHAMPIONSHIP\ LEVELS=Jerarqu\u00eda de Campeonatos
TERRITORIAL\ HIERARCHY=Jerarqu\u00eda Territorial
TERRITORIAL\ HIERARCHY\ LONG=TOP-racing cuenta con una jerarqu\u00eda territorial \u00fanica para sus campeonatos que van desde campeonatos locales hasta campeonatos mundiales. Esta jerarqu\u00eda incluye muchos niveles intermedios, brindando oportunidades para que pilotos de todos los niveles de habilidad compitan al nivel adecuado para cada uno.
TEMPORAL\ HIERARCHY=Jerarqu\u00eda Temporal
TEMPORAL\ HIERARCHY\ LONG=TOP-racing tambi\u00e9n cuenta con una jerarqu\u00eda temporal para sus campeonatos. Esto incluye campeonatos celebrados semanalmente, mensualmente, trimestralmente, anualmente, cada d\u00e9cada y de manera continua. Con campeonatos en intervalos variables, los pilotos pueden elegir participar con la frecuencia que prefieran.
