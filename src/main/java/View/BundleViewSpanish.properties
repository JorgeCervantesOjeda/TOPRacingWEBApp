AUCTION\ LONG=El estado de tu evento es ahora: SUBASTA. Los resultados del premio de terminaci\u00f3n ya est\u00e1n disponibles. Los usuarios pueden ya capturar sus pujas por los coches participantes. Procede al siguiente estado cuando todos hayan capturado sus pujas.
PUBLISHED\ LONG=El estado de tu evento es ahora: PUBLICADO. Los resultados del premio de eficiencia ya est\u00e1n disponibles. Ya no hay nada m\u00e1s que hacer. Gracias. El estado de los campeonatos ya fue actualizado con los resultados de tu evento. Hasta la pr\u00f3xima!
CANCELLED\ LONG=El estado de tu evento es ahora: CANCELADO. Este evento ya no ser\u00e1 tomado en cuenta para el c\u00e1lculo de prioridades de eventos ni tampoco para el estado de los campeonatos.
