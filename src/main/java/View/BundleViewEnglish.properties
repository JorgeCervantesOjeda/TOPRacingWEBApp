CHAMPIONSHIP\ LEVELS=Championship Levels
TERRITORIAL\ HIERARCHY=Territorial Hierarchy
TERRITORIAL\ HIERARCHY\ LONG=TOP-racing features a unique territorial hierarchy for its championships, ranging from local to world championships. This hierarchy includes many intermediate levels, providing opportunities for racers of all skill levels to compete at a level appropriate for them.
TEMPORAL\ HIERARCHY=Temporal Hierarchy
TEMPORAL\ HIERARCHY\ LONG=TOP-racing also features a temporal hierarchy for its championships. This includes championships held weekly, monthly, quarterly, yearly, decade-long and a continuous one. With championships at varying intervals, racers can choose to participate as frequently as they prefer.
