WHAT\ IS\ TOP\ RACING=What is TOP-racing?
WHAT\ IS\ P1=Welcome to TOP-racing, the exciting new racing league that brings together drivers of all skill levels to compete in a safe and fun environment. Our league is open to anyone with a passion for racing and a desire to test their skills against others.
WHAT\ IS\ P2=TOP-racing is focused on low-weight vehicles that allow for technological development and customisation, so you can bring your own unique design to the track. Our goal is to promote diversity and innovation. We allow seasoned racers to put their engineering and driving skills to the test and newcomers to get involved and start racing.
WHAT\ IS\ P3=One of the most exciting aspects of TOP-racing is the way we distribute our money prizes. We reward the best relation of performance to market value of the vehicles, which means that even if you don't have the most expensive vehicle, you still have a chance to win big. This promotes money efficiency engineering, encouraging also drivers to find creative solutions to make their cars go faster.
WHAT\ IS\ P4=But TOP-racing isn't just about winning money prizes. It's also about having fun, networking with other racing enthusiasts and pushing yourself to be the best driver/engineer you can be. Our league provides a safe and friendly environment for you to explore your passion for racing. We welcome drivers of all ages and backgrounds to join us.
WHAT\ IS\ P5=So what are you waiting for? Sign up for TOP-racing today and experience the thrill of the track like never before.
